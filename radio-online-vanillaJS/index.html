<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>芯禾電台</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <script>window.__assetVer = Date.now();</script>
    <script>document.write('<script src="platform.js?v=' + window.__assetVer + '"><\/script>');</script>
    <script>document.write('<script src="config.js?v=' + window.__assetVer + '"><\/script>');</script>
    <script>
        (function () {
            var features = (window.RADIO_CONFIG && window.RADIO_CONFIG.features) || {};
            if (!features.chat) document.documentElement.classList.add('feature-chat-off');
            if (!features.savedPlaylists) document.documentElement.classList.add('feature-playlists-off');
        })();
    </script>
    <script>document.write(
        '<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.css?v=' + window.__assetVer + '">' +
        '<link rel="stylesheet" href="styles.css?v=' + window.__assetVer + '">'
    );</script>
</head>
<body>
    <button type="button" id="mobileMenuButton" class="pc-only mobile-station-toggle btn btn-primary" aria-label="開啟電台清單" aria-controls="stationSidebar" aria-expanded="false">
        <i class="bi bi-list"></i>
    </button>
    <button type="button" id="mobileSidebarBackdrop" class="pc-only mobile-sidebar-backdrop" aria-label="關閉電台清單"></button>

    <aside id="stationSidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <h2 id="appHeading">芯禾電台</h2>
                <span class="badge badge-success online-badge" title="線上人數"><i class="bi bi-person-fill"></i> <span id="onlineUsers">0</span></span>
            </div>
        </div>
        <div class="sidebar-content">
            <div class="playlist-entry pc-only">
                <button type="button" class="btn btn-outline-primary pc-only" id="openPlaylistsButton">
                    <i class="bi bi-music-note-list"></i> 我的播放清單
                </button>
            </div>
            <div id="stationList"></div>
        </div>
        <div class="version-info">
            <div class="version-name" id="appTitle">芯禾電台</div>
            <div class="version-meta"><span id="vanillaVersion">v3.1.14</span> - <span id="vanillaYear"></span></div>
            <script>document.getElementById('vanillaYear').textContent = new Date().getFullYear();</script>
        </div>
    </aside>

    <main id="mainPanel" class="player-container">
        <div id="playerContainer" class="player-content">
            <div class="player-toolbar">
                <div class="theme-switcher pc-only" id="themeSwitcher">
                    <button class="btn btn-ghost theme-trigger" id="themeTrigger" type="button" aria-expanded="false">
                        <span class="swatch" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                        <span id="themeCurrent" class="sr-only">主題</span>
                        <i class="bi bi-chevron-down"></i>
                    </button>
                    <ul class="theme-menu" id="themeMenu"></ul>
                </div>
                <button class="btn btn-ghost icon-btn" id="themeToggle" type="button" title="切換深色或淺色">
                    <i class="bi bi-moon"></i>
                </button>
            </div>

            <audio id="audioPlayer" crossorigin="anonymous" preload="auto"></audio>

            <div id="radioStage" class="radio-stage">
                <div class="card" id="controlCard">
                    <div class="card-body">
                        <h3 id="currentStationName" class="station-title">未選擇電台</h3>
                        <p id="radioLoadStatus" class="status-line" role="status" aria-live="polite" hidden></p>
                        <div class="btn-row">
                            <button id="radioRetryButton" class="btn btn-primary" type="button" onclick="retryRadioPlayback()" hidden>重試播放</button>
                        </div>
                        <div id="radioVolumeHost">
                            <div class="volume-control" id="volumeControl">
                                <button class="btn volume-btn" id="volumeDownBtn" type="button" title="降低音量" aria-label="降低音量">
                                    <i class="bi bi-chevron-left"></i>
                                </button>
                                <input type="range" class="form-range" id="volumeSlider" min="0" max="10" step="0.1" value="10" title="音量" aria-label="音量">
                                <button class="btn volume-btn" id="volumeUpBtn" type="button" title="提高音量" aria-label="提高音量">
                                    <i class="bi bi-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="youtubeSection" style="display: none;">
                <div class="yt-page">
                    <div class="yt-stage" id="ytStage"></div>
                    <div class="card">
                        <div class="card-body">
                            <textarea class="form-control" id="youtubeUrlInput" rows="5" placeholder="每行一個影片或播放清單網址"></textarea>
                            <p id="importStatus" class="import-status" role="status" aria-live="polite"></p>
                            <div class="input-actions">
                                <button class="btn btn-primary btn-sm" id="addToPlaylist" type="button">加入播放清單</button>
                                <button class="btn btn-sm" id="clearPlaylist" type="button">清除播放清單</button>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <div class="queue-head">
                                <h3>播放清單</h3>
                                <button class="btn btn-ghost icon-btn" id="shuffleButton" type="button" title="隨機排序" disabled>
                                    <i class="bi bi-shuffle"></i>
                                </button>
                            </div>
                            <div id="queueHost">
                                <div id="playlistContainer"></div>
                            </div>
                            <p id="youtubeInitStatus" class="youtube-init-status" role="status" aria-live="polite" style="display: none;"></p>
                        </div>
                    </div>
                </div>

                <div id="playerBar" class="player-bar" hidden>
                    <div class="mini-player" id="miniPlayer">
                        <div class="mini-info">
                            <div class="mini-thumb-slot" id="miniThumbSlot">
                                <div id="ytFrame" class="yt-frame"><div id="youtubePlayer"></div></div>
                            </div>
                            <div class="mini-title" id="miniPlayerTitle">請添加影片到播放清單</div>
                        </div>
                        <div id="miniControlsHost" class="mini-controls">
                            <div id="playbackControls" class="playback-controls">
                                <button class="btn btn-control" id="prevButton" type="button" title="上一首" disabled>
                                    <i class="bi bi-skip-backward-fill"></i>
                                </button>
                                <button class="btn btn-control btn-play" id="playPauseButton" type="button" title="播放">
                                    <i class="bi bi-play-fill"></i>
                                </button>
                                <button class="btn btn-control" id="nextButton" type="button" title="下一首" disabled>
                                    <i class="bi bi-skip-forward-fill"></i>
                                </button>
                                <div id="youtubeVolumeHost"></div>
                                <button class="btn btn-control" id="muteButton" type="button" title="靜音" aria-pressed="false">
                                    <i class="bi bi-volume-up-fill"></i>
                                </button>
                            </div>
                        </div>
                        <button class="btn btn-ghost icon-btn" id="expandPlayerButton" type="button" title="展開播放器" aria-label="展開播放器">
                            <i class="bi bi-chevron-up"></i>
                        </button>
                    </div>
                </div>

                <div class="expanded-player" id="expandedPlayer">
                    <div class="expanded-header">
                        <button class="btn btn-ghost icon-btn" id="collapsePlayerButton" type="button" title="收起播放器" aria-label="收起播放器">
                            <i class="bi bi-chevron-down"></i>
                        </button>
                        <div class="expanded-title">正在播放</div>
                        <span></span>
                    </div>
                    <div class="expanded-body">
                        <div class="expanded-video">
                            <div class="video-target" id="videoTarget">
                                <div class="video-caption"><div class="video-title" id="expandedVideoTitle"></div></div>
                            </div>
                            <div class="expanded-actions" id="expandedControlsHost"></div>
                        </div>
                        <div class="expanded-queue card">
                            <div class="card-body">
                                <h3>播放清單</h3>
                                <div id="expandedQueueHost"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <button type="button" id="chatToggle" class="pc-only chat-toggle btn btn-primary" title="開啟聊天室" aria-label="開啟聊天室">
        <i class="bi bi-chat-dots-fill"></i>
        <span id="chatUnread" class="badge badge-error chat-unread" hidden>0</span>
    </button>
    <section id="chatPanel" class="pc-only chat-panel card" hidden>
        <div class="card-header chat-header">
            <strong>聊天室</strong>
            <div class="toolbar-row">
                <button type="button" id="chatNameButton" class="btn btn-sm btn-ghost" title="設定名稱">名稱</button>
                <button type="button" id="chatCloseButton" class="btn btn-sm btn-ghost" title="關閉">關閉</button>
            </div>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="card-footer chat-form">
            <input id="chatInput" class="form-control" type="text" maxlength="500" placeholder="輸入訊息..." autocomplete="off">
            <button class="btn btn-primary" type="submit">送出</button>
        </form>
    </section>

    <div id="playlistApp" class="pc-only playlist-app" hidden>
        <div id="playlistManager"></div>
        <div id="playlistDetail" hidden></div>
    </div>

    <div id="addToPlaylistModal" class="pc-only add-modal" hidden>
        <div class="add-modal-backdrop" id="addToPlaylistBackdrop"></div>
        <div class="add-modal-card card">
            <div class="card-header toolbar-row">
                <strong>加入播放清單</strong>
                <button type="button" id="closeAddModal" class="btn btn-sm">取消</button>
            </div>
            <div class="card-body">
                <p id="addModalSong" class="station-name"></p>
                <div id="addModalList"></div>
                <button type="button" id="addModalManage" class="btn btn-link">管理播放清單</button>
            </div>
        </div>
    </div>
    <div id="toastHost" class="toast-host pc-only"></div>

    <!-- SOCKET_CLIENT -->
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <!-- /SOCKET_CLIENT -->
    <script src="vendor/hls.js/hls.min.js"></script>
    <script>document.write('<script src="playlist-order.js?v=' + window.__assetVer + '"><\/script>');</script>
    <script>document.write('<script src="sync-client.js?v=' + window.__assetVer + '"><\/script>');</script>
    <script>document.write('<script src="now-playing.js?v=' + window.__assetVer + '"><\/script>');</script>
    <script>document.write('<script src="stream-player.js?v=' + window.__assetVer + '"><\/script>');</script>
    <script>document.write('<script src="app.js?v=' + window.__assetVer + '"><\/script>');</script>
    <script>
        if (!window.isTv) {
            var features = (window.RADIO_CONFIG && window.RADIO_CONFIG.features) || {};
            document.write('<script src="pc-layout.js?v=' + window.__assetVer + '"><\/script>');
            document.write('<script src="pc-theme.js?v=' + window.__assetVer + '"><\/script>');
            if (features.chat) document.write('<script src="pc-chat.js?v=' + window.__assetVer + '"><\/script>');
            document.write('<script src="pc-playlists.js?v=' + window.__assetVer + '"><\/script>');
        }
    </script>
</body>
</html>
